[project]
name = "automol"
version = "0.0.18"
authors = [
    {name = "Andreas V. Copan", email = "avcopan@uga.edu"},
    {name = "Troy N. Smith", email = "troy.smith@uga.edu"}
]
requires-python = ">= 3.12"
dependencies = [
    "more-itertools>=10.0",
    "networkx>=3.3",
    "numpy>=2.0",
    "pint>=0.24",
    "py3dmol>=2.5",
    "pydantic>=2.5",
    "pyparsing>=3.3.2",
    "rdkit>=2025",
    "scipy>=1.13",
    "stereomolgraph>=0.0.22b0",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build<0.12"]

# Ruff configurations
[tool.ruff]
exclude = [
    "docs",
    "**/*.ipynb",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing trailing comma (handled by format)
    "TID252",   # relative import
    "D203",     # confict: incorrect blank line before class (uses D211 instead)
    "D213",     # conflict: multi-line summary second line (uses D212 instead)
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Ty configurations
[tool.ty.environment]
python = ".pixi/envs/dev/bin/python"

[tool.ty.src]
include = [
    "src",
    "tests",
]

# Import-linter configurations
[tool.importlinter]
root_package = "automol"

[[tool.importlinter.contracts]]
name = "Module Layering"
type = "layers"
layers = [
    "automol.view",
    "automol.geoms",
    "automol.ident",
    "automol.geom",
    "automol.graph",
    "automol.rd",
    "automol.utils | automol.element",
]

# Pytest configurations
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--cov=automol",
    "--cov-report=term-missing",
    "--cov-report=html",
]
doctest_optionflags = "NORMALIZE_WHITESPACE"

# Pytest-cov configurations
[tool.coverage.run]
branch = true
source = ["automol"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
