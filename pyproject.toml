[project]
name = "automol"
version = "0.0.32"
readme = "README.md"  # the PyPI page
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Andreas V. Copan", email = "avcopan@uga.edu"},
    {name = "Troy N. Smith", email = "troy.smith@uga.edu"},
]
dependencies = [
    "numpy>=2.2",
    "pint>=0.24",
    "py3dmol>=2.5",
    "pydantic>=2.9",
    "pyparsing>=3.3.2",
    "rdkit>=2025.3.3",  # earlier releases fail to embed allenes (C=C=C)
    "scipy>=1.15",
    "xyzrender>=0.3.8",
]
requires-python = ">= 3.13"
classifiers = [
    "Development Status :: 7 - Inactive",  # deprecated: use autogeom
]

[project.urls]
Repository = "https://github.com/avcopan/automol"
Documentation = "https://avcopan.github.io/automol/"

[build-system]
build-backend = "uv_build"
requires = ["uv_build"]

# Ruff configurations
[tool.ruff]
extend-exclude = [".claude"]  # vendored agent skills

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing trailing comma (handled by format)
    "TID252",   # relative import
    "D203",     # conflict: incorrect blank line before class (uses D211 instead)
    "D213",     # conflict: multi-line summary second line (uses D212 instead)
    "CPY001",   # copyright notice
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "PLR2004"]  # assert, magic values

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ty configurations
[tool.ty.environment]
python = ".pixi/envs/test/bin/python"

[tool.ty.src]
include = [
    "src",
    "tests",
]

# Import-linter configurations
[tool.importlinter]
root_package = "automol"

[[tool.importlinter.contracts]]
name = "Module Layering"
type = "layers"
layers = [
    "automol.ident",
    "automol.geom",
    "automol.rd",
    "automol.utils",
]

# Pytest configurations
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--cov=automol",
    "--cov-report=term-missing",
    "--cov-report=html",
]
doctest_optionflags = "NORMALIZE_WHITESPACE"

# Pytest-cov configurations
[tool.coverage.run]
branch = true
source = ["automol"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
